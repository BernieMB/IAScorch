<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071016">
  <title>Scorchline: Arena de Artilleria</title>
  <style>
    :root {
      --page: #060b10;
      --page-deep: #020609;
      --panel: rgba(10, 21, 29, 0.88);
      --panel-bright: rgba(16, 34, 44, 0.94);
      --line: rgba(134, 197, 210, 0.2);
      --line-hot: rgba(111, 230, 255, 0.54);
      --ink: #edf8f7;
      --muted: #86a2aa;
      --cyan: #72e7ff;
      --amber: #ffbd5f;
      --danger: #ff7373;
      --good: #9bebb0;
      --mono: "Cascadia Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      --display: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html {
      height: 100%;
      overflow: hidden;
      background: var(--page-deep);
    }

    body {
      min-width: 0;
      min-height: 100%;
      height: 100dvh;
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 13% -5%, rgba(23, 77, 91, 0.28), transparent 31rem),
        radial-gradient(circle at 90% 0%, rgba(108, 47, 92, 0.17), transparent 34rem),
        var(--page);
      color: var(--ink);
      font-family: var(--mono);
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:focus-visible,
    input:focus-visible {
      outline: 2px solid var(--cyan);
      outline-offset: 3px;
    }

    .app {
      height: 100dvh;
      min-height: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: 10px;
      padding: clamp(8px, 1.4vw, 18px);
      overflow: hidden;
    }

    .app > * {
      min-height: 0;
    }

    .topbar,
    .control-deck,
    .arena {
      border: 1px solid var(--line);
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.28);
    }

    .topbar {
      min-height: 62px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 9px 10px 9px 15px;
      background: linear-gradient(100deg, rgba(9, 22, 29, 0.98), rgba(10, 16, 23, 0.88));
      position: relative;
      overflow: hidden;
    }

    .topbar::after {
      content: "";
      position: absolute;
      inset: auto -5% 0 auto;
      width: 52%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--line-hot), transparent);
    }

    .brand {
      display: flex;
      align-items: center;
      min-width: 0;
      gap: 11px;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      color: var(--cyan);
      border: 1px solid rgba(114, 231, 255, 0.75);
      background: rgba(77, 190, 214, 0.08);
      clip-path: polygon(24% 0, 76% 0, 100% 24%, 100% 76%, 76% 100%, 24% 100%, 0 76%, 0 24%);
      font-size: 15px;
      line-height: 1;
    }

    .brand-copy {
      min-width: 0;
      line-height: 1;
    }

    .brand-copy strong {
      display: block;
      color: #e9ffff;
      font-family: var(--display);
      font-size: clamp(23px, 3.2vw, 34px);
      font-weight: 400;
      letter-spacing: 0.09em;
      transform: scaleX(0.92);
      transform-origin: left center;
      white-space: nowrap;
    }

    .brand-copy span,
    .eyebrow,
    .micro-label,
    .turn-chip small,
    .fire-key,
    .weapon-meta,
    .status-line {
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    .brand-copy span {
      display: block;
      margin-top: 4px;
    }

    .topbar-actions {
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .round-readout {
      min-width: 92px;
      padding-right: 5px;
      text-align: right;
    }

    .round-readout b {
      display: block;
      color: var(--amber);
      font-size: 13px;
      letter-spacing: 0.06em;
      white-space: nowrap;
    }

    .icon-button,
    .replay-button {
      min-height: 36px;
      border: 1px solid rgba(134, 197, 210, 0.42);
      border-radius: 2px;
      background: rgba(13, 34, 42, 0.7);
      color: var(--ink);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      transition: 140ms ease;
    }

    .icon-button {
      padding: 0 12px;
    }

    .icon-button:hover,
    .replay-button:hover {
      border-color: var(--cyan);
      background: rgba(35, 89, 101, 0.68);
    }

    .arena {
      position: relative;
      min-height: 0;
      overflow: hidden;
      background: #071017;
      isolation: isolate;
    }

    .arena::before,
    .arena::after {
      content: "";
      position: absolute;
      z-index: 2;
      pointer-events: none;
    }

    .arena::before {
      inset: 7px;
      border: 1px solid rgba(148, 219, 231, 0.1);
    }

    .arena::after {
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        rgba(255, 255, 255, 0.018) 0,
        rgba(255, 255, 255, 0.018) 1px,
        transparent 1px,
        transparent 4px
      );
      mix-blend-mode: overlay;
      opacity: 0.38;
    }

    #gameCanvas {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 0;
      touch-action: none;
      cursor: crosshair;
    }

    .turn-chip {
      position: absolute;
      z-index: 3;
      top: 18px;
      left: 18px;
      min-width: 178px;
      padding: 9px 11px 10px;
      border-left: 3px solid var(--cyan);
      background: rgba(2, 10, 14, 0.76);
      box-shadow: 0 5px 24px rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(5px);
    }

    .turn-chip.enemy {
      border-left-color: var(--amber);
    }

    .turn-chip.ended {
      border-left-color: var(--good);
    }

    .turn-chip b {
      display: block;
      margin-top: 3px;
      color: var(--ink);
      font-size: 13px;
      letter-spacing: 0.05em;
    }

    .arena-stats {
      position: absolute;
      z-index: 3;
      top: 18px;
      right: 18px;
      display: flex;
      gap: 7px;
      pointer-events: none;
    }

    .arena-stat {
      min-width: 76px;
      padding: 7px 9px;
      border: 1px solid rgba(134, 197, 210, 0.16);
      background: rgba(2, 10, 14, 0.66);
      text-align: right;
      backdrop-filter: blur(4px);
    }

    .arena-stat span {
      display: block;
      color: var(--muted);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .arena-stat b {
      display: block;
      margin-top: 2px;
      color: var(--cyan);
      font-size: 13px;
    }

    .message-card {
      position: absolute;
      z-index: 5;
      top: 50%;
      left: 50%;
      width: min(330px, calc(100% - 36px));
      padding: 23px;
      border: 1px solid rgba(114, 231, 255, 0.48);
      background: rgba(4, 13, 18, 0.9);
      box-shadow: 0 24px 65px rgba(0, 0, 0, 0.54);
      text-align: center;
      transform: translate(-50%, -50%);
      backdrop-filter: blur(11px);
    }

    .message-card[hidden] {
      display: none;
    }

    .loot-toast {
      position: absolute;
      z-index: 4;
      bottom: 22px;
      left: 50%;
      max-width: calc(100% - 36px);
      padding: 9px 13px;
      border: 1px solid var(--cyan);
      background: rgba(3, 17, 22, 0.9);
      box-shadow: 0 0 22px rgba(114, 231, 255, 0.2);
      color: var(--cyan);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-align: center;
      text-transform: uppercase;
      transform: translateX(-50%);
      pointer-events: none;
    }

    .loot-toast[hidden] {
      display: none;
    }

    .loot-toast[data-weapon="cluster"] {
      border-color: #b6f28a;
      color: #b6f28a;
    }

    .loot-toast[data-weapon="big"] {
      border-color: var(--amber);
      color: var(--amber);
    }

    .loot-toast[data-weapon="nuclear"] {
      border-color: #f181ff;
      color: #f181ff;
    }

    .loot-toast[data-weapon="quake"] {
      border-color: #ff9572;
      color: #ff9572;
    }

    .message-card .eyebrow {
      color: var(--cyan);
    }

    .message-card h2 {
      margin: 8px 0 7px;
      font-family: var(--display);
      font-size: 37px;
      font-weight: 400;
      letter-spacing: 0.08em;
    }

    .message-card p {
      margin: 0 0 17px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }

    .replay-button {
      width: 100%;
      padding: 11px 14px;
      border-color: rgba(114, 231, 255, 0.55);
      color: #031116;
      background: var(--cyan);
    }

    .replay-button:hover {
      background: #c5f8ff;
    }

    .control-deck {
      display: grid;
      grid-template-columns: minmax(180px, 0.8fr) minmax(370px, 1.6fr) minmax(175px, 0.66fr);
      min-height: 0;
      background: linear-gradient(106deg, rgba(8, 19, 26, 0.98), rgba(8, 13, 19, 0.94));
    }

    .deck-section {
      min-width: 0;
      padding: 14px;
    }

    .deck-section + .deck-section {
      border-left: 1px solid var(--line);
    }

    .pilot-card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 13px;
    }

    .pilot-heading {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }

    .pilot-heading h2,
    .aim-heading h2 {
      margin: 4px 0 0;
      color: var(--ink);
      font-size: 17px;
      letter-spacing: 0.05em;
    }

    .pilot-indicator {
      display: grid;
      width: 29px;
      height: 29px;
      place-items: center;
      border: 1px solid rgba(114, 231, 255, 0.44);
      color: var(--cyan);
      font-size: 14px;
    }

    .integrity-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
    }

    .integrity-row b {
      color: var(--good);
      font-size: 22px;
      letter-spacing: -0.05em;
    }

    .integrity-track {
      height: 7px;
      overflow: hidden;
      border: 1px solid rgba(134, 197, 210, 0.2);
      background: #071016;
    }

    .integrity-track i {
      display: block;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #61d9a2, #b5f3b9);
      box-shadow: 0 0 11px rgba(116, 241, 180, 0.65);
      transition: width 180ms ease, background 180ms ease;
    }

    .pilot-status {
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .aim-card {
      display: grid;
      grid-template-columns: minmax(245px, 0.88fr) minmax(190px, 1.12fr);
      align-items: center;
      gap: 17px;
    }

    .aim-controls {
      display: grid;
      gap: 13px;
    }

    .aim-heading {
      display: flex;
      min-height: 47px;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .aim-heading > div:first-child {
      min-width: 0;
    }

    .aim-heading h2 {
      font-size: 14px;
    }

    .status-line {
      align-self: center;
      color: var(--cyan);
      text-align: right;
      white-space: nowrap;
    }

    .range-control {
      display: grid;
      grid-template-columns: 60px 1fr 52px;
      align-items: center;
      gap: 9px;
    }

    .range-control label {
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .range-control output {
      color: var(--amber);
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.04em;
      text-align: right;
    }

    input[type="range"] {
      width: 100%;
      height: 18px;
      margin: 0;
      appearance: none;
      border: 0;
      background: transparent;
    }

    input[type="range"]::-webkit-slider-runnable-track {
      height: 4px;
      border: 1px solid rgba(134, 197, 210, 0.3);
      border-radius: 0;
      background: linear-gradient(90deg, rgba(90, 205, 229, 0.28), rgba(255, 189, 95, 0.48));
    }

    input[type="range"]::-webkit-slider-thumb {
      width: 14px;
      height: 14px;
      margin-top: -6px;
      appearance: none;
      border: 2px solid #041015;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 0 1px rgba(114, 231, 255, 0.8), 0 0 12px rgba(114, 231, 255, 0.72);
    }

    input[type="range"]::-moz-range-track {
      height: 4px;
      border: 1px solid rgba(134, 197, 210, 0.3);
      background: linear-gradient(90deg, rgba(90, 205, 229, 0.28), rgba(255, 189, 95, 0.48));
    }

    input[type="range"]::-moz-range-thumb {
      width: 11px;
      height: 11px;
      border: 2px solid #041015;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 0 1px rgba(114, 231, 255, 0.8), 0 0 12px rgba(114, 231, 255, 0.72);
    }

    #angleInput {
      direction: rtl;
    }

    #angleInput::-webkit-slider-runnable-track {
      background: linear-gradient(90deg, rgba(255, 189, 95, 0.48), rgba(90, 205, 229, 0.28));
    }

    #angleInput::-moz-range-track {
      background: linear-gradient(90deg, rgba(255, 189, 95, 0.48), rgba(90, 205, 229, 0.28));
    }

    .weapons {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 7px;
    }

    .weapon-button {
      min-height: 72px;
      padding: 9px 8px 8px;
      border: 1px solid rgba(134, 197, 210, 0.23);
      border-radius: 0;
      background: rgba(11, 28, 36, 0.68);
      color: var(--ink);
      text-align: left;
      transition: 130ms ease;
    }

    .weapon-button:hover:not(:disabled) {
      border-color: rgba(114, 231, 255, 0.76);
      background: rgba(23, 62, 73, 0.75);
    }

    .weapon-button.selected {
      border-color: var(--cyan);
      background: linear-gradient(135deg, rgba(22, 76, 89, 0.9), rgba(13, 36, 47, 0.9));
      box-shadow: inset 3px 0 0 var(--cyan), 0 0 20px rgba(42, 183, 210, 0.08);
    }

    .weapon-button[data-weapon="big"].selected {
      border-color: var(--amber);
      box-shadow: inset 3px 0 0 var(--amber), 0 0 20px rgba(255, 189, 95, 0.08);
    }

    .weapon-button[data-weapon="cluster"].selected {
      border-color: #b6f28a;
      box-shadow: inset 3px 0 0 #b6f28a, 0 0 20px rgba(182, 242, 138, 0.1);
    }

    .weapon-button[data-weapon="quake"].selected {
      border-color: #ff9572;
      box-shadow: inset 3px 0 0 #ff9572, 0 0 20px rgba(255, 149, 114, 0.1);
    }

    .weapon-button[data-weapon="nuclear"].selected {
      border-color: #f181ff;
      box-shadow: inset 3px 0 0 #f181ff, 0 0 20px rgba(241, 129, 255, 0.1);
    }

    .weapon-button:disabled {
      cursor: not-allowed;
      opacity: 0.37;
    }

    .weapon-name,
    .weapon-count {
      display: block;
    }

    .weapon-name {
      color: var(--ink);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    .weapon-count {
      margin-top: 7px;
      color: var(--cyan);
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.06em;
    }

    .weapon-button[data-weapon="big"] .weapon-count {
      color: var(--amber);
    }

    .weapon-button[data-weapon="cluster"] .weapon-count {
      color: #b6f28a;
    }

    .weapon-button[data-weapon="quake"] .weapon-count {
      color: #ff9572;
    }

    .weapon-button[data-weapon="nuclear"] .weapon-count {
      color: #f181ff;
    }

    .weapon-meta {
      display: block;
      margin-top: 2px;
      font-size: 8px;
    }

    .fire-card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
      background: linear-gradient(155deg, rgba(23, 37, 39, 0.37), rgba(9, 16, 22, 0));
    }

    .fire-button {
      position: relative;
      min-height: 65px;
      overflow: hidden;
      border: 1px solid rgba(255, 189, 95, 0.8);
      border-radius: 0;
      background: linear-gradient(135deg, #ec9d3c, #ffce77);
      color: #1a1005;
      font-family: var(--display);
      font-size: 27px;
      font-weight: 400;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      transition: 140ms ease;
    }

    .fire-button::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: -40%;
      width: 25%;
      transform: skewX(-24deg);
      background: rgba(255, 255, 255, 0.36);
      transition: 320ms ease;
    }

    .fire-button:hover:not(:disabled)::after {
      left: 120%;
    }

    .fire-button:hover:not(:disabled) {
      background: #ffe0a3;
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(255, 166, 53, 0.24);
    }

    .fire-button:disabled {
      cursor: not-allowed;
      border-color: rgba(134, 197, 210, 0.2);
      background: #23323a;
      color: #758990;
    }

    .fire-key {
      display: block;
      color: var(--muted);
      text-align: center;
    }

    .event-feed {
      min-height: 33px;
      border-top: 1px solid rgba(134, 197, 210, 0.16);
      padding-top: 8px;
    }

    .feed-line {
      overflow: hidden;
      color: #afc7cb;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.02em;
      line-height: 1.38;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .feed-line + .feed-line {
      margin-top: 2px;
      opacity: 0.56;
    }

    .feed-line.tone-player {
      color: var(--cyan);
    }

    .feed-line.tone-alert {
      color: var(--amber);
    }

    .feed-line.tone-danger {
      color: #ff9f9f;
    }

    @media (max-width: 930px) {
      .control-deck {
        grid-template-columns: minmax(160px, 0.75fr) minmax(380px, 1.75fr);
      }

      .fire-card {
        grid-column: 1 / -1;
        display: grid;
        grid-template-columns: 170px 1fr;
        align-items: center;
        border-top: 1px solid var(--line);
      }

      .fire-button {
        grid-row: auto;
      }

      .event-feed {
        border-top: 0;
        border-bottom: 1px solid rgba(134, 197, 210, 0.16);
        padding: 0 0 7px;
      }
    }

    @media (max-width: 690px) {
      .app {
        height: 100dvh;
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto;
        gap: 7px;
        padding: 7px;
      }

      .topbar {
        min-height: 53px;
        margin-bottom: 0;
        padding: 8px 9px;
      }

      .brand-mark {
        display: none;
      }

      .brand-copy strong {
        font-size: 25px;
      }

      .brand-copy span,
      .round-readout {
        display: none;
      }

      .icon-button {
        min-height: 33px;
        padding: 0 9px;
        font-size: 9px;
      }

      .arena {
        height: auto;
        min-height: 0;
        margin-bottom: 0;
      }

      #gameCanvas {
        height: 100%;
        min-height: 0;
      }

      .turn-chip {
        top: 13px;
        left: 13px;
        min-width: 145px;
        padding: 7px 8px;
      }

      .turn-chip b {
        font-size: 11px;
      }

      .arena-stats {
        top: 13px;
        right: 13px;
      }

      .arena-stat {
        min-width: 57px;
        padding: 5px 6px;
      }

      .arena-stat:first-child {
        display: none;
      }

      .control-deck {
        display: grid;
        grid-template-columns: minmax(104px, 0.66fr) minmax(0, 1.34fr);
      }

      .deck-section {
        padding: 8px;
      }

      .deck-section + .deck-section {
        border-top: 0;
        border-left: 1px solid var(--line);
      }

      .pilot-card {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .pilot-heading {
        grid-row: auto;
      }

      .pilot-heading h2 {
        font-size: 15px;
      }

      .pilot-indicator {
        width: 25px;
        height: 25px;
      }

      .pilot-status {
        font-size: 8px;
      }

      .aim-card {
        display: block;
      }

      .aim-controls {
        gap: 7px;
      }

      .aim-heading h2 {
        font-size: 12px;
      }

      .range-control {
        grid-template-columns: 48px 1fr 39px;
        gap: 5px;
      }

      .range-control label {
        font-size: 8px;
      }

      .range-control output {
        font-size: 12px;
      }

      .weapons {
        margin-top: 9px;
        gap: 4px;
      }

      .weapon-button {
        min-height: 49px;
        padding: 6px 4px;
      }

      .fire-card {

    @media (max-width: 390px) {
      .range-control {
        grid-template-columns: 45px 1fr 37px;

      .weapon-name {

    @media (max-height: 650px) and (min-width: 691px) {

  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">+</div>
        <div class="brand-copy">
          <strong>SCORCHLINE</strong>
          <span>arena balistica // todos contra todos</span>
        </div>
      </div>
      <div class="topbar-actions">
        <div class="round-readout">
          <span class="micro-label">ciclo de combate</span>

    <section class="arena" id="arena" aria-label="Campo de batalla">

        </div>
      </div>
      <div class="loot-toast" id="lootToast" hidden aria-live="polite"></div>
      <section class="message-card" id="messageCard" hidden aria-live="assertive">
        <div class="eyebrow">informe final</div>
        <h2 id="messageTitle">VICTORIA</h2>
        <p id="messageText"></p>
        <button class="replay-button" id="replayButton" type="button">Reiniciar combate</button>

    <section class="control-deck" aria-label="Controles de combate">

        <div>
          <div class="integrity-row">
            <span class="micro-label">integridad</span>

          <div class="integrity-track" aria-label="Integridad del tanque"><i id="healthBar"></i></div>
        </div>
        <div class="pilot-status" id="pilotStatus">SISTEMAS OPERATIVOS</div>
      </section>

      <section class="deck-section aim-card" aria-label="Punteria y municion">
        <div class="aim-controls">
          <div class="aim-heading">
            <div>
              <div class="eyebrow">solucion de tiro</div>

          </div>
          <div class="range-control">

            <output id="angleValue" for="angleInput">055&deg;</output>
          </div>
          <div class="range-control">
            <label for="powerInput">Fuerza</label>
            <input id="powerInput" type="range" min="18" max="100" step="1" value="72" aria-label="Fuerza de tiro">
            <output id="powerValue" for="powerInput">072%</output>
          </div>
        </div>
        <div class="weapons" aria-label="Seleccion de misil">
          <button class="weapon-button selected" type="button" data-weapon="normal" aria-pressed="true">
            <span class="weapon-name">NORMAL</span>
            <span class="weapon-count" data-count="normal">&infin;</span>
            <span class="weapon-meta">tiros libres</span>
          </button>
          <button class="weapon-button" type="button" data-weapon="cluster" aria-pressed="false">
            <span class="weapon-name">RACIMO</span>
            <span class="weapon-count" data-count="cluster">02</span>
            <span class="weapon-meta">tres cabezas</span>
          </button>
          <button class="weapon-button" type="button" data-weapon="big" aria-pressed="false">
            <span class="weapon-name">GRANDE</span>

          </button>
          <button class="weapon-button" type="button" data-weapon="quake" aria-pressed="false">
            <span class="weapon-name">SISMICO</span>
            <span class="weapon-count" data-count="quake">01</span>

      <section class="deck-section fire-card" aria-label="Disparo y eventos">
